name: Tests on the PC (water)

# The full test suite on the owner's own Windows PC (the self-hosted runner),
# inside the app's published image, which has Linux, Node and the ffmpeg
# encoders the tests use. The checkout is copied into the container rather
# than mounted, so the timing is the PC's and not Windows file sharing's.
# Only pushes to release/next-update (and a manual run) start it, never pull
# requests, so nobody else's code runs on the PC.

on:
  push:
    branches: [release/next-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v7
      - name: The machine
        run: |
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors
          "RAM GB: " + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          docker info --format "Docker: {{.ServerVersion}}, CPUs {{.NCPU}}, RAM {{.MemTotal}}"
      - name: Test suite
        run: |
          $img = 'ghcr.io/skittles-fivem/sentry-manager:latest'
          docker pull -q $img
          docker rm -f sm-tests 2>$null | Out-Null
          # the encoding tests look for ffmpeg in ffmpeg_bin/ (not in git): the image's own
          $run = 'mkdir -p ffmpeg_bin && ln -sf /usr/lib/jellyfin-ffmpeg/ffmpeg /usr/lib/jellyfin-ffmpeg/ffprobe ffmpeg_bin/ && exec node --disable-warning=ExperimentalWarning --test "test/**/*.test.js"'
          docker create --name sm-tests --user root -w /w --entrypoint sh $img -c $run | Out-Null
          docker cp "$env:GITHUB_WORKSPACE\." sm-tests:/w
          $sw = [Diagnostics.Stopwatch]::StartNew()
          docker start -a sm-tests > tests.log 2>&1
          $code = $LASTEXITCODE
          $sw.Stop()
          docker rm -f sm-tests | Out-Null
          Select-String -Path tests.log -Pattern '^not ok' -Context 0,12 | ForEach-Object { $_.Line; $_.Context.PostContext }
          Get-Content tests.log -Tail 9
          # tests skipped for a missing tool would make the timing meaningless
          Select-String -Path tests.log -Pattern '# SKIP' | Select-Object -First 5 | ForEach-Object { $_.Line }
          "Wall clock: " + [math]::Round($sw.Elapsed.TotalSeconds) + " s"
          exit $code
