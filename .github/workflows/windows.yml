name: Windows

# Builds, checks and publishes the native Windows package (no Docker, no WSL).
#   - test: the whole test suite on Windows, with the pinned ffmpeg on PATH,
#     the helper and service built with the csc.exe Windows ships, and
#     REQUIRE_TOOLS=1 so a missing tool fails instead of skipping.
#   - app: the native app (SentrySix.exe, windows\app) built with the .NET
#     SDK, its Core tests against the real server, and every page listed in
#     windows\app\Shell\RENDER-PAGES.md rendered to PNG (artifact
#     native-renders, for tools/parity/report.js). Runs beside test.
#   - package: windows\build.ps1 makes the zip, SHA256SUMS, release.json
#     and SentrySixManager-Setup-<version>.exe (the same files in one
#     installer, windows\setup\SentrySixManager.iss; artifact
#     SentrySixManager-Setup).
#   - install-check: installs with that Setup as a user would, silently
#     (/VERYSILENT /MODE=service: it runs the package's install.ps1 in
#     Windows PowerShell 5.1), checks the web UI over HTTPS, the service
#     account and the one Settings > Apps entry, then uninstalls with the
#     Setup's uninstaller (unins000.exe) and checks nothing is left.
#   - install-check-app: the same Setup without the service (/MODE=app):
#     the server started as the app starts it, checked, stopped by writing
#     "stop" to it, then uninstalled the same way.
#   - publish: on a push to main only, a GitHub Release with the Setup, the
#     zip, SHA256SUMS and release.json (what update notices and update.ps1
#     read).
# Docker-only and macOS-only changes do not run it, and it never touches
# ghcr.io. Never on pull requests: nobody else's code runs here with this
# repository's token.

on:
  push:
    branches: [main, wip]
    # (not the Dockerfile: build.ps1 takes the app file list from it)
    paths-ignore:
      - 'docker-compose*.yml'
      - 'truenas/**'
      - '.github/workflows/image.yml'
      - '.github/workflows/water.yml'
      - '.github/workflows/water-tests.yml'
      - 'macos/**'
      - 'native/darwin/**'
      - '.github/workflows/macos.yml'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

# Read-only by default; only publish may write (the release).
permissions:
  contents: read

# A newer push replaces a build still running for an older one.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # (the tests never see a token)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The ffmpeg the package ships, checked against windows\versions.json.
      # Only this job goes on without a pinned SHA-256 (and says so loudly),
      # so the hash can be read from the log; package refuses to.
      # the scripts people run are Windows PowerShell 5.1: parse them with it
      # first, so a syntax slip fails here in seconds, not at install time
      - name: PowerShell scripts parse (5.1)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $bad = 0
          # (windows\setup: the Setup's own helper)
          foreach ($f in Get-ChildItem -Path windows, windows\setup -Filter *.ps1) {
            $tokens = $null; $errs = $null
            $rel = $f.FullName.Substring((Get-Location).Path.Length + 1) -replace '\\', '/'
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
          Write-Host "All windows\*.ps1 and windows\setup\*.ps1 parse in PowerShell $($PSVersionTable.PSVersion)"
      - name: Pinned ffmpeg
        run: |
          $pin = (Get-Content -Raw -LiteralPath windows/versions.json | ConvertFrom-Json).ffmpeg
          $url = [string]$pin.url
          if ($url -notmatch '^https://') { throw "windows/versions.json: the ffmpeg url must be https" }
          $dl = Join-Path $env:RUNNER_TEMP 'ffmpeg-download'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          $zip = Join-Path $dl 'ffmpeg.zip'
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Downloading ffmpeg $($pin.version) from $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $want = ([string]$pin.sha256).ToLowerInvariant()
          Write-Host "ffmpeg sha256: $got"
          if ($want -eq 'update_me') {
            Write-Host "::warning title=ffmpeg not verified::ffmpeg sha256: $got (windows/versions.json still says UPDATE_ME; check it against the publisher's and put it in the sha256 field. This test run used it unverified; package will not.)"
          } elseif ($want -notmatch '^[0-9a-f]{64}$') {
            throw "windows/versions.json: the ffmpeg sha256 is neither a SHA-256 nor UPDATE_ME"
          } elseif ($got -ne $want) {
            throw "the ffmpeg download does not match its pinned SHA-256 (expected $want, got $got)"
          }
          # only the two programs leave the archive, each to a fixed name
          $bin = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($name in 'ffmpeg.exe', 'ffprobe.exe') {
              $from = [string]$pin.files.$name
              $entry = $z.GetEntry($from)
              if (-not $entry) { throw "the ffmpeg archive has no ${from}: fix its path in windows/versions.json" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $bin $name), $true)
            }
          } finally { $z.Dispose() }
          Remove-Item -LiteralPath $dl -Recurse -Force
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1

      # The same compiler and references as build.ps1. Each is built once its
      # source exists; until then the tests that need it say so.
      - name: Helper and service (csc)
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { throw "no .NET Framework 4.8 compiler at $csc" }
          $out = Join-Path $env:GITHUB_WORKSPACE 'build\bin'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $programs = @(
            @{ src = 'windows\helper\SentryHelper.cs'; exe = 'SentryHelper.exe'; refs = @('System.dll', 'System.Core.dll', 'System.Management.dll', 'System.Web.Extensions.dll') },
            @{ src = 'windows\service\SentryService.cs'; exe = 'SentryService.exe'; refs = @('System.dll', 'System.Core.dll', 'System.ServiceProcess.dll') },
            @{ src = 'windows\power\SentryPower.cs'; exe = 'SentryPower.exe'; refs = @('System.dll', 'System.Core.dll', 'System.ServiceProcess.dll') }
          )
          foreach ($p in $programs) {
            if (-not (Test-Path -LiteralPath $p.src)) {
              Write-Host "::notice::$($p.src) is not written yet; $($p.exe) is not built"
              continue
            }
            $exe = Join-Path $out $p.exe
            $cscArgs = @('/nologo', '/target:exe', '/optimize+', '/platform:x64', "/out:$exe") + @($p.refs | ForEach-Object { "/reference:$_" }) + $p.src
            & $csc @cscArgs
            if ($LASTEXITCODE -ne 0) { throw "csc could not compile $($p.src)" }
            Write-Host "Built $exe"
          }
          $helper = Join-Path $out 'SentryHelper.exe'
          if (Test-Path -LiteralPath $helper) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "SENTRY_HELPER=$helper" }
          $service = Join-Path $out 'SentryService.exe'
          if (Test-Path -LiteralPath $service) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "SENTRY_SERVICE_EXE=$service" }

      - name: Tests
        env:
          REQUIRE_TOOLS: '1'
        run: |
          Write-Host "ffmpeg: $((Get-Command ffmpeg).Source)"
          Write-Host "ffprobe: $((Get-Command ffprobe).Source)"
          npm test

  # The native app. Does not wait for test (that takes long); package waits
  # for both.
  app:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # the Core tests start the real server (server/index.js) with this node
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build SentrySix.exe
        run: |
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) { throw 'no .NET SDK (dotnet) on this runner' }
          dotnet --version
          $out = Join-Path $env:GITHUB_WORKSPACE 'build\app-ui'
          dotnet build windows/app/SentrySix.csproj -c Release -o $out -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed (exit code $LASTEXITCODE)" }
          $exe = Join-Path $out 'SentrySix.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "the build made no $exe" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SENTRY_APP_EXE=$exe"
          Get-ChildItem -LiteralPath $out -Recurse -File | ForEach-Object { $_.FullName.Substring($out.Length + 1) }

      - name: Core tests (against the real server)
        run: |
          $proj = 'windows/app/Core.Tests'
          if (-not (Test-Path -LiteralPath "$proj/Core.Tests.csproj")) { throw "$proj/Core.Tests.csproj is missing: the Core tests have to exist before this job can pass" }
          node --version
          dotnet run --project $proj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed (exit code $LASTEXITCODE)" }

      # Every "<interface> <page>" pair RENDER-PAGES.md lists (a list item, a
      # table row or a code line naming one of the five interfaces), at the
      # two sizes tools/parity/capture.js takes the web pages at; the names
      # match its files, <interface>-<page>-<width>x<height>.png.
      - name: Render the pages (SentrySix.exe --render)
        run: |
          $list = 'windows/app/Shell/RENDER-PAGES.md'
          if (-not (Test-Path -LiteralPath $list)) { throw "$list is missing: the shell has to list the pages its --render mode draws" }
          if (-not $env:SENTRY_APP_EXE -or -not (Test-Path -LiteralPath $env:SENTRY_APP_EXE)) { throw 'SentrySix.exe was not built (see the build step)' }
          # (also the "SentrySix.exe --render <interface> <page> ..." command lines it lists)
          $rx = '(?:^\s*(?:[-*+]\s+|\|\s*|\d+\.\s+)?|--render\s+)`?(builtin|horizon|flux|aurora|daylight)`?\s*(?:\|\s*|\s+)`?([a-z][a-z0-9-]*)`?'
          $pairs = @(Get-Content -LiteralPath $list | ForEach-Object { if ($_ -match $rx) { "$($Matches[1]) $($Matches[2])" } } | Sort-Object -Unique)
          if (-not $pairs.Count) { throw "$list lists no '<interface> <page>' lines (interfaces: builtin, horizon, flux, aurora, daylight)" }
          $out = Join-Path $env:GITHUB_WORKSPACE 'native-renders'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $sizes = @(@{ w = 1400; h = 900 }, @{ w = 390; h = 844 })
          $bad = 0
          foreach ($pair in $pairs) {
            $ui, $page = $pair -split ' '
            foreach ($sz in $sizes) {
              $png = Join-Path $out "$ui-$page-$($sz.w)x$($sz.h).png"
              $argList = @('--render', $ui, $page, '--width', $sz.w, '--height', $sz.h, '--out', "`"$png`"")
              $p = Start-Process -FilePath $env:SENTRY_APP_EXE -ArgumentList $argList -PassThru -NoNewWindow
              if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::error::$ui $page $($sz.w)x$($sz.h): no result within 2 minutes"; $bad++; continue }
              if ($p.ExitCode -ne 0) { Write-Host "::error::$ui $page $($sz.w)x$($sz.h): SentrySix.exe --render exit code $($p.ExitCode)"; $bad++; continue }
              if (-not (Test-Path -LiteralPath $png) -or (Get-Item -LiteralPath $png).Length -lt 100) { Write-Host "::error::$ui $page $($sz.w)x$($sz.h): no PNG written"; $bad++; continue }
              Write-Host "rendered $png"
            }
          }
          if ($bad) { throw "$bad render(s) failed" }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-renders
          path: native-renders/
          if-no-files-found: warn
          retention-days: 14

  package:
    needs: [test, app]
    runs-on: windows-latest
    # (compressing the Setup takes a few minutes of it)
    timeout-minutes: 45
    outputs:
      zip: ${{ steps.made.outputs.zip }}
      setup: ${{ steps.made.outputs.setup }}
      version: ${{ steps.made.outputs.version }}
      short: ${{ steps.made.outputs.short }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # build.ps1 refuses an unpinned download. Before it does, show the
      # hashes the maintainer needs, so one run is enough to fill them in.
      - name: Pinned downloads have a SHA-256
        run: |
          $pins = Get-Content -Raw -LiteralPath windows/versions.json | ConvertFrom-Json
          $unset = @()
          $ProgressPreference = 'SilentlyContinue'
          foreach ($name in 'node', 'ffmpeg', 'innosetup', 'pawnio-setup', 'pawnio-modules') {
            $pin = $pins.$name
            $want = ([string]$pin.sha256).ToLowerInvariant()
            if ($want -match '^[0-9a-f]{64}$') { Write-Host "$name sha256 (pinned): $want"; continue }
            if ($want -ne 'update_me') { throw "windows/versions.json: the $name sha256 is neither a SHA-256 nor UPDATE_ME" }
            $url = [string]$pin.url
            if ($url -notmatch '^https://') { throw "windows/versions.json: the $name url must be https" }
            $file = Join-Path $env:RUNNER_TEMP "$name-unpinned.download"
            Invoke-WebRequest -Uri $url -OutFile $file
            $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            Remove-Item -LiteralPath $file -Force
            $unset += [pscustomobject]@{ name = $name; url = $url; sha256 = $got }
          }
          if (-not $unset.Count) { exit 0 }
          # node publishes its own checksums; compare against those as well
          $nodeNote = ''
          $n = @($unset | Where-Object name -eq 'node')
          if ($n.Count) {
            try {
              $sums = (Invoke-WebRequest -Uri "https://nodejs.org/dist/v$($pins.node.version)/SHASUMS256.txt").Content
              $leaf = [IO.Path]::GetFileName(([Uri]$n[0].url).AbsolutePath)
              $line = ($sums -split "`n") | Where-Object { $_ -match "^\s*[0-9a-f]{64}\s+$([regex]::Escape($leaf))\s*$" } | Select-Object -First 1
              if (-not $line) { $nodeNote = "nodejs.org's SHASUMS256.txt has no line for $leaf" }
              elseif ($line.Trim().Split(' ')[0] -eq $n[0].sha256) { $nodeNote = "node matches nodejs.org's SHASUMS256.txt" }
              else { $nodeNote = "node does NOT match nodejs.org's SHASUMS256.txt: do not use it" }
            } catch { $nodeNote = "could not read nodejs.org's SHASUMS256.txt ($($_.Exception.Message))" }
          }
          Write-Host ''
          Write-Host '================ windows/versions.json needs these ================'
          foreach ($u in $unset) { Write-Host "$($u.name) sha256: $($u.sha256)"; Write-Host "  from $($u.url)" }
          if ($nodeNote) { Write-Host $nodeNote }
          Write-Host '===================================================================='
          $summary = @('### windows/versions.json needs its SHA-256 values', '')
          $summary += @($unset | ForEach-Object { "- $($_.name): ``$($_.sha256)``" })
          if ($nodeNote) { $summary += @('', $nodeNote) }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          foreach ($u in $unset) { Write-Host "::error title=$($u.name) not pinned::$($u.name) sha256: $($u.sha256)" }
          Write-Host "::error::windows/versions.json still says UPDATE_ME for $(($unset | ForEach-Object name) -join ' and '). Check the values above against the publisher's own checksums, paste each into its sha256 field and push again."
          exit 1

      # Windows PowerShell 5.1, as people run it
      - name: Build the package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows\build.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::windows\build.ps1 failed (exit code $LASTEXITCODE)"; exit 1 }

      - name: What was made
        id: made
        run: |
          $zips = @(Get-ChildItem -LiteralPath dist -Filter 'SentrySixManager-*-win-x64.zip' -File)
          if ($zips.Count -ne 1) { throw "expected one zip in dist, found $($zips.Count)" }
          foreach ($f in 'SHA256SUMS', 'release.json') { if (-not (Test-Path -LiteralPath (Join-Path dist $f))) { throw "dist has no $f" } }
          $rel = Get-Content -Raw -LiteralPath dist/release.json | ConvertFrom-Json
          $version = [string]$rel.version
          if ($version -notmatch '^[A-Za-z0-9][A-Za-z0-9._+-]{0,39}$') { throw "release.json has no usable version" }
          if ([string]$rel.sha -ne $env:GITHUB_SHA) { throw "release.json names $($rel.sha), this run built $env:GITHUB_SHA" }
          $setup = "SentrySixManager-Setup-$version.exe"
          $setups = @(Get-ChildItem -LiteralPath dist -Filter 'SentrySixManager-Setup-*.exe' -File)
          if ($setups.Count -ne 1 -or $setups[0].Name -ne $setup) { throw "expected $setup in dist, found: $(($setups | ForEach-Object Name) -join ', ')" }
          $sums = Get-Content -LiteralPath dist/SHA256SUMS
          foreach ($f in $zips[0].Name, 'release.json', $setup) {
            if (-not ($sums | Where-Object { $_ -match "^[0-9a-f]{64}  $([regex]::Escape($f))$" })) { throw "SHA256SUMS has no line for $f" }
          }
          $sums
          Write-Host "$setup is $([math]::Round($setups[0].Length / 1MB, 1)) MB"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @("zip=$($zips[0].Name)", "setup=$setup", "version=$version", "short=$($env:GITHUB_SHA.Substring(0, 7))")

      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # the one file people download and run, on its own
      - uses: actions/upload-artifact@v7
        with:
          name: SentrySixManager-Setup
          path: dist/${{ steps.made.outputs.setup }}
          if-no-files-found: error
          retention-days: 14

  install-check:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    # Windows PowerShell 5.1 throughout: what install.ps1 and uninstall.ps1
    # meet on people's PCs (the hosted runner is an administrator)
    defaults:
      run:
        shell: powershell
    env:
      ZIP: ${{ needs.package.outputs.zip }}
      SETUP: ${{ needs.package.outputs.setup }}
      VERSION: ${{ needs.package.outputs.version }}
      PORT: '9000'
      APPS_KEY: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{37874499-7900-4DA9-8103-133AFC180A56}_is1'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist

      - name: The Setup matches SHA256SUMS
        run: |
          $setup = Join-Path $PWD "dist\$env:SETUP"
          $line = Get-Content -LiteralPath dist\SHA256SUMS | Where-Object { $_ -match "^[0-9a-f]{64}  $([regex]::Escape($env:SETUP))$" } | Select-Object -First 1
          if (-not $line) { throw "SHA256SUMS has no line for $env:SETUP" }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          if ($got -ne $line.Substring(0, 64)) { throw "$env:SETUP does not match SHA256SUMS" }

      # as a script or an updater would: no window, the mode on the command line
      - name: Install (Setup /VERYSILENT /MODE=service)
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process -FilePath (Join-Path $PWD "dist\$env:SETUP") -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MODE=service', '/CPUPOWER=1', "/LOG=`"$log`"") -Wait -PassThru
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          if ($p.ExitCode -ne 0) { Write-Host "::error::$env:SETUP failed (exit code $($p.ExitCode)); install.ps1's lines are in the log above"; exit 1 }

      - name: Start menu entry, start at sign-in, mode
        run: |
          $exe = Join-Path $env:ProgramFiles 'SentrySixManager\app-ui\SentrySix.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "no $exe" }
          $lnk = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Sentry Six Manager.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw "no Start menu entry at $lnk" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne $exe) { throw "the Start menu entry opens $target, not $exe" }
          $run = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').SentrySixManager
          if ($run -ne "`"$exe`" --tray") { throw "the sign-in start is '$run'" }
          $mode = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\SentrySixManager').Mode
          if ($mode -ne 'service') { throw "install.ps1 recorded mode '$mode', expected service" }
          Write-Host "Start menu entry, sign-in start ($run) and mode ($mode) are in place"

      - name: One entry in Settings > Apps, with its uninstaller
        run: |
          if (-not (Test-Path -LiteralPath $env:APPS_KEY)) { throw "no Settings > Apps entry at $env:APPS_KEY" }
          $e = Get-ItemProperty -LiteralPath $env:APPS_KEY
          if ($e.DisplayName -ne 'Sentry Six Manager') { throw "the entry is called '$($e.DisplayName)'" }
          if ($e.Publisher -ne 'Sentry Six') { throw "the entry's publisher is '$($e.Publisher)'" }
          if ($e.DisplayVersion -ne $env:VERSION) { throw "the entry says version '$($e.DisplayVersion)', expected $env:VERSION" }
          $unins = Join-Path $env:ProgramFiles 'SentrySixManager-Uninstall\unins000.exe'
          if (-not (Test-Path -LiteralPath $unins)) { throw "no uninstaller at $unins" }
          if ($e.UninstallString -notlike "*$unins*") { throw "the entry uninstalls with '$($e.UninstallString)', not $unins" }
          if ($e.DisplayIcon -notlike '*SentrySixManager\app-ui\SentrySix.exe*') { throw "the entry's icon is '$($e.DisplayIcon)'" }
          $all = @(foreach ($root in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall') {
            if (Test-Path -LiteralPath $root) {
              Get-ChildItem -LiteralPath $root | ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } | Where-Object { $_.PSObject.Properties['DisplayName'] -and "$($_.DisplayName)" -like 'Sentry Six*' } | ForEach-Object { $_.PSChildName }
            }
          })
          if ($all.Count -ne 1) { throw "expected one Settings > Apps entry for Sentry Six Manager, found $($all.Count): $($all -join ', ')" }
          Write-Host "One Settings > Apps entry ($($all[0])), version $($e.DisplayVersion), uninstaller $unins"

      # update.ps1 and the in-app updates install the zip, not the Setup: it
      # must hold exactly what the Setup installed
      - name: The zip matches SHA256SUMS and holds what the Setup installed
        run: |
          $zip = Join-Path $PWD "dist\$env:ZIP"
          $line = Get-Content -LiteralPath dist\SHA256SUMS | Where-Object { $_ -match "^[0-9a-f]{64}  $([regex]::Escape($env:ZIP))$" } | Select-Object -First 1
          if (-not $line) { throw "SHA256SUMS has no line for $env:ZIP" }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($got -ne $line.Substring(0, 64)) { throw "$env:ZIP does not match SHA256SUMS" }
          $pkg = Join-Path $env:RUNNER_TEMP 'pkg'
          if (Test-Path -LiteralPath $pkg) { Remove-Item -LiteralPath $pkg -Recurse -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $pkg)
          $ver = (Get-Content -LiteralPath (Join-Path $pkg 'app\version.json') -Raw | ConvertFrom-Json).version
          if ($ver -ne $env:VERSION) { throw "the zip's app\version.json says '$ver', expected $env:VERSION" }
          foreach ($need in 'install.ps1', 'uninstall.ps1', 'update.ps1', 'Install.cmd', 'README-Windows.txt', 'app-ui\SentrySix.exe', 'node\node.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $pkg $need) -PathType Leaf)) { throw "the zip has no $need" }
          }
          $inst = Join-Path $env:ProgramFiles 'SentrySixManager'
          $files = @(Get-ChildItem -LiteralPath $pkg -Recurse -File -Force)
          $bad = @()
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($pkg.Length + 1)
            # install.ps1 copies everything but the readme into Program Files
            if ($rel -eq 'README-Windows.txt') { continue }
            $there = Join-Path $inst $rel
            if (-not (Test-Path -LiteralPath $there -PathType Leaf)) { $bad += "missing: $rel"; continue }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $there).Hash) { $bad += "differs: $rel" }
          }
          if ($bad.Count -gt 0) { $bad | Select-Object -First 30 | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) of the zip's $($files.Count) files are not what the Setup installed" }
          Write-Host "$env:ZIP matches SHA256SUMS; its $($files.Count) files are the ones the Setup installed in $inst"

      - name: The web UI answers over HTTPS
        run: |
          $ErrorActionPreference = 'Continue'
          $base = "https://127.0.0.1:$env:PORT"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            curl.exe -fsk --max-time 10 -o NUL "$base/healthz"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Write-Host "::error::$base/healthz did not answer"; exit 1 }
          $code = curl.exe -sk --max-time 10 -o NUL -w '%{http_code}' "$base/login"
          if ($code -ne '200') { Write-Host "::error::$base/login answered $code, expected 200"; exit 1 }
          Write-Host "healthz and the login page answer on $base"

      - name: The service runs as its own account, not an administrator
        run: |
          $account = 'NT SERVICE\SentrySixManager'
          $svc = Get-CimInstance Win32_Service -Filter "Name='SentrySixManager'"
          if (-not $svc) { throw 'the SentrySixManager service is not installed' }
          if ($svc.State -ne 'Running') { throw "the service is $($svc.State), not Running" }
          if ($svc.StartName -ne $account) { throw "the service logs on as $($svc.StartName), not $account" }
          # what actually runs: the service host and node, both as that account
          $dir = Join-Path $env:ProgramFiles 'SentrySixManager'
          foreach ($name in 'SentryService.exe', 'node.exe') {
            $procs = @(Get-CimInstance Win32_Process -Filter "Name='$name'" | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith("$dir\", [StringComparison]::OrdinalIgnoreCase) })
            if (-not $procs.Count) { throw "no $name is running from $dir" }
            foreach ($p in $procs) {
              $o = Invoke-CimMethod -InputObject $p -MethodName GetOwner
              if ("$($o.Domain)\$($o.User)" -ne $account) { throw "$name (pid $($p.ProcessId)) runs as $($o.Domain)\$($o.User), not $account" }
            }
          }
          # neither the account nor every service (NT SERVICE\ALL SERVICES) is in Administrators
          $mine = (New-Object Security.Principal.NTAccount $account).Translate([Security.Principal.SecurityIdentifier]).Value
          $bad = @($mine, 'S-1-5-80-0')
          $group = (New-Object Security.Principal.SecurityIdentifier 'S-1-5-32-544').Translate([Security.Principal.NTAccount]).Value -replace '^.*\\', ''
          $members = @(([ADSI]"WinNT://./$group,group").psbase.Invoke('Members') | ForEach-Object {
            $bytes = $_.GetType().InvokeMember('objectSid', 'GetProperty', $null, $_, $null)
            [Security.Principal.SecurityIdentifier]::new([byte[]]$bytes, 0).Value
          })
          Write-Host "$group members: $($members -join ', ')"
          foreach ($sid in $bad) { if ($members -contains $sid) { throw "$sid is in $group" } }
          $rule = @(Get-NetFirewallRule -Name 'SentrySixManager-WebUI' -ErrorAction SilentlyContinue)
          if (-not $rule.Count) { throw 'install.ps1 added no firewall rule' }
          Write-Host "The service and node run as $account ($mine), which is not an administrator"

      # /CPUPOWER=1: PawnIO and the CPU power service. A runner is a virtual
      # machine, whose MSRs the hypervisor keeps, so no watts are expected;
      # this shows what was installed and what the service says.
      - name: CPU power (informational)
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Service -Name 'SentrySixPower' -ErrorAction SilentlyContinue | Format-List Name, Status, StartType
          Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO' -ErrorAction SilentlyContinue | Format-List DisplayName, DisplayVersion
          Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\SentrySixManager\PawnIO' -ErrorAction SilentlyContinue | Format-List InstalledBySentry, Version
          $exe = Join-Path $env:ProgramFiles 'SentrySixManager\bin\SentryPower.exe'
          if (Test-Path -LiteralPath $exe) { & $exe --once; Write-Host "SentryPower.exe --once: exit code $LASTEXITCODE" }
          exit 0

      # as Settings > Apps does, silently, with the data too (the default keeps it)
      - name: Uninstall (unins000.exe /VERYSILENT /REMOVEDATA=1)
        run: |
          $ErrorActionPreference = 'Continue'
          $unins = Join-Path $env:ProgramFiles 'SentrySixManager-Uninstall\unins000.exe'
          if (-not (Test-Path -LiteralPath $unins)) { Write-Host "::error::no $unins"; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP 'uninstall.log'
          $p = Start-Process -FilePath $unins -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/REMOVEDATA=1', "/LOG=`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::the uninstaller failed (exit code $($p.ExitCode))"; exit 1 }

      # (the uninstaller deletes itself and its folder a moment after it exits)
      - name: Nothing is left
        run: |
          $dir = Join-Path $env:ProgramFiles 'SentrySixManager'
          $until = (Get-Date).AddSeconds(60)
          do {
            $left = @()
            if (Get-Service -Name 'SentrySixManager' -ErrorAction SilentlyContinue) { $left += 'the service' }
            if (Get-Service -Name 'SentrySixPower' -ErrorAction SilentlyContinue) { $left += 'the CPU power service' }
            if (@(Get-NetFirewallRule -Name 'SentrySixManager-WebUI' -ErrorAction SilentlyContinue).Count) { $left += 'the firewall rule' }
            foreach ($p in $dir, "$dir.new", "$dir.old", "$dir-Uninstall", (Join-Path $env:ProgramData 'SentrySixManager')) {
              if (Test-Path -LiteralPath $p) { $left += $p }
            }
            $running = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith("$dir\", [StringComparison]::OrdinalIgnoreCase) })
            if ($running.Count) { $left += "$($running.Count) process(es) from $dir" }
            if (Test-Path -LiteralPath (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Sentry Six Manager.lnk')) { $left += 'the Start menu entry' }
            if ($null -ne (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').PSObject.Properties['SentrySixManager']) { $left += 'the start at sign-in' }
            if (Test-Path -LiteralPath 'HKLM:\SOFTWARE\SentrySixManager') { $left += 'HKLM\SOFTWARE\SentrySixManager' }
            if (Test-Path -LiteralPath $env:APPS_KEY) { $left += 'the Settings > Apps entry' }
            if (-not $left.Count) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $until)
          if ($left.Count) { throw "uninstall left: $($left -join '; ')" }
          Write-Host 'Uninstalled cleanly: no service, firewall rule, Start menu entry, sign-in start, Settings > Apps entry, uninstaller, program files or data'

      - name: Logs (on failure)
        if: failure()
        run: |
          Get-Service -Name 'SentrySixManager' -ErrorAction SilentlyContinue | Format-List Name, Status, StartType
          foreach ($p in (Join-Path $env:RUNNER_TEMP 'setup.log'), (Join-Path $env:RUNNER_TEMP 'uninstall.log'), (Join-Path $env:TEMP 'SentrySixManager-Setup.log'), (Join-Path $env:TEMP 'SentrySixManager-Uninstall.log')) {
            Write-Host "== $p"
            if (Test-Path -LiteralPath $p) { Get-Content -LiteralPath $p -Tail 300 } else { Write-Host '(none)' }
          }
          foreach ($f in 'service.log', 'manager.log') {
            $p = Join-Path $env:ProgramData "SentrySixManager\data\logs\$f"
            Write-Host "== $p"
            if (Test-Path -LiteralPath $p) { Get-Content -LiteralPath $p -Tail 200 } else { Write-Host '(none)' }
          }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddHours(-1) } -MaxEvents 30 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'SentrySix|Service Control Manager|\.NET Runtime|Application Error' } |
            Format-List TimeCreated, ProviderName, Message

  # The same Setup without the service: the app runs the server. Here the
  # server is started as the app starts it (SentryService.exe run --data, as
  # the user who installed it) and stopped as the app's Quit stops it
  # ("stop" on its stdin).
  install-check-app:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      SETUP: ${{ needs.package.outputs.setup }}
      PORT: '9000'
      APPS_KEY: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{37874499-7900-4DA9-8103-133AFC180A56}_is1'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist

      - name: The Setup matches SHA256SUMS
        run: |
          $setup = Join-Path $PWD "dist\$env:SETUP"
          $line = Get-Content -LiteralPath dist\SHA256SUMS | Where-Object { $_ -match "^[0-9a-f]{64}  $([regex]::Escape($env:SETUP))$" } | Select-Object -First 1
          if (-not $line) { throw "SHA256SUMS has no line for $env:SETUP" }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          if ($got -ne $line.Substring(0, 64)) { throw "$env:SETUP does not match SHA256SUMS" }

      - name: Install without the service (Setup /VERYSILENT /MODE=app)
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process -FilePath (Join-Path $PWD "dist\$env:SETUP") -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/MODE=app', '/CPUPOWER=0', "/LOG=`"$log`"") -Wait -PassThru
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          if ($p.ExitCode -ne 0) { Write-Host "::error::$env:SETUP /MODE=app failed (exit code $($p.ExitCode)); install.ps1's lines are in the log above"; exit 1 }

      - name: No service; Start menu entry, start at sign-in, data rights for this user, one Apps entry
        run: |
          if (Get-Service -Name 'SentrySixManager' -ErrorAction SilentlyContinue) { throw 'the Setup with /MODE=app installed the service' }
          $exe = Join-Path $env:ProgramFiles 'SentrySixManager\app-ui\SentrySix.exe'
          $lnk = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Sentry Six Manager.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw "no Start menu entry at $lnk" }
          $run = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').SentrySixManager
          if ($run -ne "`"$exe`" --tray") { throw "the sign-in start is '$run'" }
          $reg = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\SentrySixManager'
          $me = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          if ($reg.Mode -ne 'app') { throw "install.ps1 recorded mode '$($reg.Mode)', expected app" }
          # (the Setup worked out who started it, setup-user.ps1, and passed -ForUser)
          if ($reg.AppUserSid -ne $me) { throw "the data is for $($reg.AppUserSid), not this user ($me)" }
          $data = Join-Path $env:ProgramData 'SentrySixManager\data'
          $acl = Get-Acl -LiteralPath $data
          $mine = @($acl.Access | Where-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value -eq $me -and ($_.FileSystemRights -band [Security.AccessControl.FileSystemRights]::Modify) -eq [Security.AccessControl.FileSystemRights]::Modify })
          if (-not $mine.Count) { throw "this user ($me) cannot change $data" }
          if (@(Get-NetFirewallRule -Name 'SentrySixManager-WebUI' -ErrorAction SilentlyContinue).Count -eq 0) { throw 'install.ps1 added no firewall rule' }
          if (-not (Test-Path -LiteralPath $env:APPS_KEY)) { throw "no Settings > Apps entry at $env:APPS_KEY" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'SentrySixManager-Uninstall\unins000.exe'))) { throw 'no uninstaller' }
          Write-Host "App mode for $me; Start menu entry, sign-in start, firewall rule and Settings > Apps entry in place"

      - name: The server, started as the app starts it, answers over HTTPS and stops on "stop"
        run: |
          $ErrorActionPreference = 'Continue'
          $dataRoot = Join-Path $env:ProgramData 'SentrySixManager'
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = Join-Path $env:ProgramFiles 'SentrySixManager\bin\SentryService.exe'
          $psi.Arguments = "run --data `"$dataRoot`""
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $server = [System.Diagnostics.Process]::Start($psi)
          $base = "https://127.0.0.1:$env:PORT"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            if ($server.HasExited) { break }
            curl.exe -fsk --max-time 10 -o NUL "$base/healthz"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds 2
          }
          $failed = $null
          if (-not $ok) { $failed = "$base/healthz did not answer (server exited: $($server.HasExited))" }
          else {
            $code = curl.exe -sk --max-time 10 -o NUL -w '%{http_code}' "$base/login"
            if ($code -ne '200') { $failed = "$base/login answered $code, expected 200" }
          }
          if (-not $server.HasExited) {
            $server.StandardInput.WriteLine('stop')
            $server.StandardInput.Flush()
            if (-not $server.WaitForExit(120000)) { $server.Kill(); if (-not $failed) { $failed = 'the server did not stop within 2 minutes of "stop"' } }
            elseif ($server.ExitCode -ne 0 -and -not $failed) { $failed = "the server stopped with exit code $($server.ExitCode), expected 0" }
          }
          $dir = Join-Path $env:ProgramFiles 'SentrySixManager'
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith("$dir\", [StringComparison]::OrdinalIgnoreCase) })
          if ($left.Count -and -not $failed) { $failed = "after stop, still running: $(($left | ForEach-Object Name) -join ', ')" }
          if ($failed) { Write-Host "::error::$failed"; exit 1 }
          Write-Host "healthz and the login page answered on $base; the server stopped cleanly on stop"

      - name: Uninstall (unins000.exe /VERYSILENT /REMOVEDATA=1)
        run: |
          $ErrorActionPreference = 'Continue'
          $unins = Join-Path $env:ProgramFiles 'SentrySixManager-Uninstall\unins000.exe'
          if (-not (Test-Path -LiteralPath $unins)) { Write-Host "::error::no $unins"; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP 'uninstall.log'
          $p = Start-Process -FilePath $unins -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/REMOVEDATA=1', "/LOG=`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::the uninstaller failed (exit code $($p.ExitCode))"; exit 1 }

      - name: Nothing is left
        run: |
          $dir = Join-Path $env:ProgramFiles 'SentrySixManager'
          $until = (Get-Date).AddSeconds(60)
          do {
            $left = @()
            if (Get-Service -Name 'SentrySixManager' -ErrorAction SilentlyContinue) { $left += 'a service' }
            if (Get-Service -Name 'SentrySixPower' -ErrorAction SilentlyContinue) { $left += 'the CPU power service' }
            if (@(Get-NetFirewallRule -Name 'SentrySixManager-WebUI' -ErrorAction SilentlyContinue).Count) { $left += 'the firewall rule' }
            foreach ($p in $dir, "$dir.new", "$dir.old", "$dir-Uninstall", (Join-Path $env:ProgramData 'SentrySixManager')) {
              if (Test-Path -LiteralPath $p) { $left += $p }
            }
            if (Test-Path -LiteralPath (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Sentry Six Manager.lnk')) { $left += 'the Start menu entry' }
            if ($null -ne (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').PSObject.Properties['SentrySixManager']) { $left += 'the start at sign-in' }
            if (Test-Path -LiteralPath 'HKLM:\SOFTWARE\SentrySixManager') { $left += 'HKLM\SOFTWARE\SentrySixManager' }
            if (Test-Path -LiteralPath $env:APPS_KEY) { $left += 'the Settings > Apps entry' }
            if (-not $left.Count) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $until)
          if ($left.Count) { throw "uninstall left: $($left -join '; ')" }
          Write-Host 'Uninstalled cleanly'

      - name: Logs (on failure)
        if: failure()
        run: |
          foreach ($p in (Join-Path $env:RUNNER_TEMP 'setup.log'), (Join-Path $env:RUNNER_TEMP 'uninstall.log'), (Join-Path $env:TEMP 'SentrySixManager-Setup.log'), (Join-Path $env:TEMP 'SentrySixManager-Uninstall.log')) {
            Write-Host "== $p"
            if (Test-Path -LiteralPath $p) { Get-Content -LiteralPath $p -Tail 300 } else { Write-Host '(none)' }
          }
          foreach ($f in 'service.log', 'manager.log') {
            $p = Join-Path $env:ProgramData "SentrySixManager\data\logs\$f"
            Write-Host "== $p"
            if (Test-Path -LiteralPath $p) { Get-Content -LiteralPath $p -Tail 200 } else { Write-Host '(none)' }
          }

  publish:
    needs: [package, install-check, install-check-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: dist

      # Never a draft or a pre-release: update notices and update.ps1 read
      # the latest final release only. A published release with all four
      # files (a re-run) is left as it was; one left a draft or short of a
      # file by a run cut off is finished here.
      - name: GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ needs.package.outputs.zip }}
          SETUP: ${{ needs.package.outputs.setup }}
          VERSION: ${{ needs.package.outputs.version }}
          SHORT: ${{ needs.package.outputs.short }}
        run: |
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,39}$ ]] || { echo "::error::no usable version"; exit 1; }
          [[ "$SHORT" =~ ^[0-9a-f]{7}$ ]] || { echo "::error::no short commit id"; exit 1; }
          [[ "$SETUP" == "SentrySixManager-Setup-$VERSION.exe" ]] || { echo "::error::no Setup ($SETUP)"; exit 1; }
          sha256sum -c SHA256SUMS
          tag="v$VERSION-$SHORT"
          if have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
            if jq -e --arg zip "$ZIP" --arg setup "$SETUP" '(.isDraft | not) and ([.assets[].name] as $n | [$setup, $zip, "SHA256SUMS", "release.json"] | all(. as $f | $n | index($f)))' <<<"$have" >/dev/null; then
              echo "::notice::Release $tag already exists; left as it is"
              exit 0
            fi
            echo "::notice::Release $tag is a draft or short of a file; finishing it"
            gh release upload "$tag" "$SETUP" "$ZIP" SHA256SUMS release.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            exit 0
          fi
          level="$(jq -r '.critical.level // 0' release.json)"
          reason="$(jq -r '.critical.reason // ""' release.json)"
          {
            echo "Sentry Six Manager $VERSION for Windows (x64), built from $GITHUB_SHA."
            echo
            echo "Download $SETUP and run it. Running a newer one upgrades in place and keeps your data; uninstall it in Settings > Apps."
            echo
            echo "$ZIP is the same program for update.ps1 and the in-app updates (or unpack it and double-click Install.cmd)."
            echo "Already installed: run update.ps1 in %ProgramFiles%\\SentrySixManager as administrator."
            echo "Check the download against SHA256SUMS."
            if [ "$level" != 0 ] && [ -n "$reason" ]; then echo; echo "Critical update (level $level): $reason"; fi
          } > notes.md
          gh release create "$tag" "$SETUP" "$ZIP" SHA256SUMS release.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sentry Six Manager $VERSION for Windows ($SHORT)" \
            --notes-file notes.md \
            --latest
