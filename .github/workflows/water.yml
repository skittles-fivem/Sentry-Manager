name: Windows PC (water)

# Runs on the owner's own Windows PC (a self-hosted runner) for what GitHub's
# machines cannot test: real GPUs, the network, a TrueNAS node. Only pushes
# to wip start it, never pull requests, so nobody else's code runs there.

on:
  push:
    branches: [wip]

permissions:
  contents: read

concurrency:
  group: water
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    defaults:
      run:
        # Windows blocks .ps1 scripts by default; bypass it for this step's
        # own script only (the PC's setting stays as it is)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Windows, CPU and GPUs
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, AdapterRAM, PNPDeviceID, VideoProcessor
          "Admin: " + ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "User: " + [Security.Principal.WindowsIdentity]::GetCurrent().Name
      - name: Tools already installed
        run: |
          foreach ($t in 'node','ffmpeg','ffprobe','nvidia-smi','git','docker','pwsh') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            if ($c) { "$t -> $($c.Source)" } else { "$t -> (not found)" }
          }
          try { node -v } catch {}
          try { nvidia-smi --query-gpu=name,driver_version,pci.bus_id --format=csv } catch {}
      - name: Test clips on the PC (read only)
        run: |
          foreach ($d in 'C:\Users\ktmcm\OneDrive\Desktop\2026-10-19', 'C:\Users\ktmcm\OneDrive\Desktop\2026-07-21') {
            "== $d"
            if (-not (Test-Path -LiteralPath $d)) { '  (missing)'; continue }
            $f = Get-ChildItem -LiteralPath $d -Recurse -File
            "  files: $($f.Count), MB: $([math]::Round((($f | Measure-Object Length -Sum).Sum)/1MB))"
            # cloud-only OneDrive files carry the RecallOnDataAccess attribute (0x400000)
            "  cloud-only: $(($f | Where-Object { ([int]$_.Attributes -band 0x400000) -ne 0 }).Count)"
            $f | Select-Object -First 12 | ForEach-Object { '  ' + $_.FullName.Substring($d.Length) + '  ' + [math]::Round($_.Length/1MB,1) + ' MB' }
          }

  # The converter's decode tiers on this PC's real GPUs (docs/plans/windows.md,
  # section 8): tools/gpuTiers.js copies a minute of the owner's HW3 and HW4
  # clips (read only; three whole minutes of each) into the runner's temp folder and encodes them on every
  # GPU, codec and tier the app would try, with the app's own arguments,
  # verifier and picture check. The JSON report is kept as an artifact.
  gpu:
    needs: probe
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # node.exe, ffmpeg.exe and ffprobe.exe exactly as windows\versions.json
      # pins them (SHA-256 checked), kept in a folder next to the runner's
      # work folders so later runs reuse them (each file's hash is checked
      # again before it is reused).
      - name: Pinned node and ffmpeg
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pins = Get-Content -Raw -LiteralPath windows\versions.json | ConvertFrom-Json
          $cache = Join-Path (Split-Path -Parent $env:RUNNER_WORKSPACE) '_sentry-tools'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $utf8 = New-Object Text.UTF8Encoding $false
          function Get-Sha([string]$file) { (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant() }
          foreach ($tool in 'node', 'ffmpeg') {
            $pin = $pins.$tool
            $want = ([string]$pin.sha256).ToLowerInvariant()
            if ($want -notmatch '^[0-9a-f]{64}$') { throw "windows/versions.json: $tool has no SHA-256" }
            if ([string]$pin.url -notmatch '^https://') { throw "windows/versions.json: the $tool url must be https" }
            $dir = Join-Path $cache "$tool-$($pin.version)"
            $marker = Join-Path $dir 'hashes.json'
            $names = @($pin.files.PSObject.Properties | ForEach-Object { $_.Name })
            $reuse = $false
            if (Test-Path -LiteralPath $marker) {
              $known = Get-Content -Raw -LiteralPath $marker | ConvertFrom-Json
              $reuse = ($known.zip -eq $want)
              foreach ($name in $names) {
                $file = Join-Path $dir $name
                if (-not $reuse -or -not (Test-Path -LiteralPath $file) -or (Get-Sha $file) -ne $known.files.$name) { $reuse = $false }
              }
            }
            if ($reuse) {
              Write-Host "$tool $($pin.version): reused from $dir"
            } else {
              if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              $zip = Join-Path $env:RUNNER_TEMP "$tool.zip"
              Write-Host "Downloading $tool $($pin.version) from $($pin.url)"
              Invoke-WebRequest -UseBasicParsing -Uri ([string]$pin.url) -OutFile $zip
              $got = Get-Sha $zip
              if ($got -ne $want) { throw "the $tool download does not match its pinned SHA-256 (expected $want, got $got)" }
              $hashes = @{}
              $z = [IO.Compression.ZipFile]::OpenRead($zip)
              try {
                foreach ($name in $names) {
                  $from = [string]$pin.files.$name
                  $entry = $z.GetEntry($from)
                  if (-not $entry) { throw "the $tool archive has no $from" }
                  $file = Join-Path $dir $name
                  [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $file, $true)
                  $hashes[$name] = Get-Sha $file
                }
              } finally { $z.Dispose() }
              Remove-Item -LiteralPath $zip -Force
              [IO.File]::WriteAllText($marker, (@{ zip = $want; files = $hashes } | ConvertTo-Json), $utf8)
            }
          }
          $nodeExe = Join-Path $cache "node-$($pins.node.version)\node.exe"
          $ffDir = Join-Path $cache "ffmpeg-$($pins.ffmpeg.version)"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SENTRY_NODE=$nodeExe`nSENTRY_FFMPEG=$(Join-Path $ffDir 'ffmpeg.exe')`nSENTRY_FFPROBE=$(Join-Path $ffDir 'ffprobe.exe')`n", $utf8)
          & $nodeExe -v
          & (Join-Path $ffDir 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1

      # The helper lists the Intel/AMD adapters (gpu.list), as in the app.
      - name: Helper (csc)
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) { throw "no .NET Framework 4.8 compiler at $csc" }
          $bin = Join-Path $env:RUNNER_TEMP 'helper'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $exe = Join-Path $bin 'SentryHelper.exe'
          & $csc /nologo /optimize+ /platform:x64 /target:exe /reference:System.dll /reference:System.Core.dll /reference:System.Management.dll /reference:System.Web.Extensions.dll "/out:$exe" windows\helper\SentryHelper.cs
          if ($LASTEXITCODE -ne 0) { throw 'csc could not compile SentryHelper.cs' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SENTRY_HELPER=$exe`n", (New-Object Text.UTF8Encoding $false))
          Write-Host "Built $exe"

      # TEMPORARY (NVENC rate-control experiment): tools/nvencRate.js on the
      # clips hevc_nvenc overshot; restore the full GPU tier run afterwards.
      - name: NVENC rate control (overshooting clips)
        run: |
          $ErrorActionPreference = 'Stop'
          nvidia-smi --query-gpu=name,driver_version,pci.bus_id --format=csv
          $out = Join-Path $env:RUNNER_TEMP 'gputiers'
          $report = Join-Path $env:RUNNER_TEMP 'gpu-report\nvenc-rate.json'
          & $env:SENTRY_NODE tools\nvencRate.js --ffmpeg $env:SENTRY_FFMPEG --ffprobe $env:SENTRY_FFPROBE `
            --clips 'C:\Users\ktmcm\OneDrive\Desktop\2026-10-19' --clips 'C:\Users\ktmcm\OneDrive\Desktop\2026-07-21' `
            --out $out --report $report
          $code = $LASTEXITCODE
          $text = Join-Path $env:RUNNER_TEMP 'gpu-report\nvenc-rate.txt'
          if (Test-Path -LiteralPath $text) {
            $fence = '```'
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "${fence}text`n$([IO.File]::ReadAllText($text))`n${fence}`n", (New-Object Text.UTF8Encoding $false))
          }
          exit $code

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-tiers
          path: ${{ runner.temp }}\gpu-report
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          foreach ($d in 'gputiers', 'gpu-report', 'helper') {
            $p = Join-Path $env:RUNNER_TEMP $d
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction Continue }
          }
