# Sentry Six Manager: install.sh puts this in /etc/newsyslog.d/sentry-six-manager.conf.
# service.log gets only what launchd catches on stdout and stderr (crashes
# before the app's own log starts); the app's log is data/logs/manager.log.
# Rotated at 10 MB, one old copy, compressed. launchd keeps writing to the
# old file until the service restarts, so N: no process to signal.
# logfilename                                  owner:group      mode count size  when flags
/Library/Logs/SentrySixManager/service.log      _sentrysix:admin 640  1     10240 *    NZ
